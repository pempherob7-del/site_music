<!DOCTYPE html>
<html>

<head>
    <title>Pemphero Music Site</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Pemphero Music Site</h1>
        <p>Discover, listen and download music</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/add-song">Add Song</a>
        <a href="/search">Search</a>
    </nav>

    <main>

        <form action="/search" method="GET">

            <input
                type="text"
                name="q"
                placeholder="Search songs or artists..."
                required
            >

            <button type="submit">Search</button>

        </form>

        <h2>Featured Songs</h2>

        {% if songs %}

            {% for song in songs %}

            <div class="song-card">

                <img
                    src="/images/{{ song[4] }}"
                    alt="Song cover"
                >

                <h3>{{ song[1] }}</h3>

                <p>{{ song[2] }}</p>

                <audio controls>
                    <source
                        src="/music/{{ song[3] }}"
                        type="audio/mpeg"
                    >
                </audio>

                <!-- DOWNLOAD -->
                <div style="text-align:center; margin-top:25px;">

                    <a
                        href="/download/{{ song[3] }}"
                        style="
                            display:inline-block;
                            background:#facc15;
                            color:#111827;
                            padding:16px 30px;
                            border-radius:40px;
                            text-decoration:none;
                            font-size:18px;
                            font-weight:bold;
                        "
                    >
                        ⬇ Download Song
                    </a>

                </div>

            </div>

            {% endfor %}

        {% else %}

            <p style="text-align:center;">
                No songs uploaded yet.
            </p>

        {% endif %}

    </main>

</body>

</html>
